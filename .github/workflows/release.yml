name: Release

on:
    push:
        tags:
            - '*.*.*'

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22.x'
                  cache: 'npm'

            - name: Verify release tag matches manifest version
              run: |
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  test "$GITHUB_REF_NAME" = "$manifest_version"

            - run: npm ci

            - run: npm run build

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      main.js
                      styles.css
                      manifest.json
