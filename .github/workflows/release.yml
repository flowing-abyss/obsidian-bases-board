name: Release

on:
    push:
        tags:
            - '*.*.*'

jobs:
    release:
        runs-on: ubuntu-latest

        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: '24.x'
                  cache: 'npm'

            - name: Verify release tag matches manifest version
              run: |
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  test "$GITHUB_REF_NAME" = "$manifest_version"

            - run: npm ci

            - run: npm run build

            - name: Attest release assets
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css
                      manifest.json

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  generate_release_notes: true
                  files: |
                      main.js
                      styles.css
                      manifest.json
